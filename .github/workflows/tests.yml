on:
  workflow_dispatch:

name: Run tests under podman

jobs:

  container_start:
    name: Bisect the conu container start
    runs-on: ubuntu-latest
    steps:
      - name: Start podman's docker-compatible socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done
          docker version

      - name: Bisect the flags conu passes
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
        run: |
          set +e
          docker pull -q quay.io/bodhi-ci/postgresql:latest
          image=$(docker images --no-trunc --format '{{.ID}}' quay.io/bodhi-ci/postgresql:latest)
          net=$(docker network create --driver bridge bodhi_test-probe)
          mkdir -p /tmp/conu-probe

          echo "=== A: everything conu passes ==="
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name dbA \
            --network "$net" --network-alias db --network-alias db.ci -d \
            --cidfile=/tmp/conu-probe/cidA -l conu.test_artifact "$image"
          echo "exit=$?"

          echo "=== B: drop --cidfile ==="
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name dbB \
            --network "$net" --network-alias db --network-alias db.ci -d \
            -l conu.test_artifact "$image"
          echo "exit=$?"

          echo "=== C: drop the bare label ==="
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name dbC \
            --network "$net" --network-alias db --network-alias db.ci -d \
            --cidfile=/tmp/conu-probe/cidC "$image"
          echo "exit=$?"
