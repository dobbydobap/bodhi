on:
  workflow_dispatch:

name: Run tests under podman

jobs:

  image_ref:
    name: Which image reference podman accepts
    runs-on: ubuntu-latest
    steps:
      - name: Start podman's docker-compatible socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done

      - name: Compare the three references for one image
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
        run: |
          set +e
          docker pull -q quay.io/bodhi-ci/postgresql:latest
          id=$(docker inspect --format '{{.Id}}' quay.io/bodhi-ci/postgresql:latest)
          bare=${id#sha256:}
          echo "Id   = $id"
          echo "bare = $bare"

          echo "=== 1. sha256-prefixed Id, what conu passes ==="
          docker run --rm -d --name c1 "$id"; echo "exit=$?"

          echo "=== 2. bare hex Id ==="
          docker run --rm -d --name c2 "$bare"; echo "exit=$?"

          echo "=== 3. repository tag ==="
          docker run --rm -d --name c3 quay.io/bodhi-ci/postgresql:latest; echo "exit=$?"
