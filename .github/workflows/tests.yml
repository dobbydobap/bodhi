on:
  workflow_dispatch:

name: Run tests under podman

jobs:

  image_ref:
    name: How podman resolves the image reference
    runs-on: ubuntu-latest
    steps:
      - name: Start podman's docker-compatible socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done

      - name: Pull via the API the way conu does, then run by each reference
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
        run: |
          set +e
          python3 -m pip install -q docker
          python3 - <<'PY'
          import docker
          c = docker.APIClient(version="auto")
          for line in c.pull("quay.io/bodhi-ci/postgresql", tag="latest", stream=True, decode=True):
              pass
          i = c.inspect_image("quay.io/bodhi-ci/postgresql:latest")
          print("inspect Id   =", i["Id"])
          print("RepoDigests  =", i.get("RepoDigests"))
          print("RepoTags     =", i.get("RepoTags"))
          open("/tmp/imgid", "w").write(i["Id"])
          PY

          id=$(cat /tmp/imgid)
          echo "=== run by inspect Id (what conu uses) ==="
          docker run --rm -d --name r1 "$id"; echo "exit=$?"

          echo "=== run by tag ==="
          docker run --rm -d --name r2 quay.io/bodhi-ci/postgresql:latest; echo "exit=$?"

          echo "=== what podman stores ==="
          podman images --no-trunc
