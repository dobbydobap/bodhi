on:
  workflow_dispatch:

name: Run tests under podman

jobs:

  runtimes:
    name: What the runner has
    runs-on: ubuntu-latest
    steps:
      - name: Check podman
        run: |
          which podman docker || true
          podman --version
          ls -l /usr/libexec/podman/catatonit || echo "no catatonit"
          podman run --rm quay.io/fedora/fedora:latest true
          podman run --rm --init quay.io/fedora/fedora:latest true
          podman info --format '{{.Host.RemoteSocket.Path}}'

  precommit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12 || 3.13 || 3.14'

      - name: Install deps
        run: pip install click

      - name: Run the pre-commit checks
        run: devel/ci/bodhi-ci pre-commit -r pip -c podman

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12 || 3.13 || 3.14'

      - name: Install deps
        run: pip install click

      - name: Run the unit tests
        run: devel/ci/bodhi-ci unit -r f45 -m bodhi-client -c podman

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12 || 3.13 || 3.14'

      - name: Install deps
        run: pip install click -r docs/requirements.txt

      - name: Build the docs
        run: devel/ci/bodhi-ci docs -r f45 -c podman

  rpms:
    name: Build the RPMS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12 || 3.13 || 3.14'

      - name: Install deps
        run: pip install click

      - name: Build the rpms
        run: devel/ci/bodhi-ci rpm -r f45 -c podman

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12 || 3.13 || 3.14'

      - name: Install deps
        run: pip3 install click -r devel/ci/integration/requirements.txt

      - name: Start podman's docker-compatible socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done
          DOCKER_HOST=unix:///tmp/podman.sock docker version

      - name: Run the integration tests
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
        run: python3 devel/ci/bodhi-ci integration -r f45 -c podman
