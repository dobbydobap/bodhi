on:
  workflow_dispatch:

name: Run tests under podman

jobs:

  network_alias:
    name: Reproduce the conu container start
    runs-on: ubuntu-latest
    steps:
      - name: Start podman's docker-compatible socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done
          docker version

      - name: Run the same command conu runs
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
        run: |
          docker pull quay.io/bodhi-ci/postgresql:latest
          image=$(docker images --no-trunc --format '{{.ID}}' quay.io/bodhi-ci/postgresql:latest)
          net=$(docker network create --driver bridge bodhi_test-probe)
          echo "network id: $net"

          echo "--- by id, with aliases (what conu does) ---"
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name db1 \
            --network "$net" --network-alias db --network-alias db.ci \
            -d "$image"; echo "exit=$?"

          echo "--- by name, with aliases ---"
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name db2 \
            --network bodhi_test-probe --network-alias db --network-alias db.ci \
            -d "$image"; echo "exit=$?"

          echo "--- by name, no aliases ---"
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust --name db3 \
            --network bodhi_test-probe \
            -d "$image"; echo "exit=$?"
